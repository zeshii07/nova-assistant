<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Nova Kiosk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: linear-gradient(135deg, #0a0e1a, #0d1228, #0f1530); font-family: Inter, system-ui, sans-serif; }
    #kiosk-app { height: 100dvh; display: flex; flex-direction: column; }
    .kiosk-header { padding: 20px; text-align: center; background: rgba(17,24,42,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #28324b; }
    .kiosk-header h1 { color: #e8edf7; font-size: 22px; }
    .kiosk-header p { color: #91a0bd; font-size: 13px; margin-top: 4px; }
    .kiosk-chat { flex: 1; overflow: hidden; }
    .kiosk-footer { padding: 12px; text-align: center; color: #7485a8; font-size: 11px; }
    .kiosk-footer a { color: #5ec5f5; text-decoration: none; }
    .idle-overlay { position: fixed; inset: 0; background: rgba(10,14,26,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; cursor: pointer; }
    .idle-overlay h2 { color: #e8edf7; font-size: 28px; margin-bottom: 8px; }
    .idle-overlay p { color: #91a0bd; font-size: 16px; }
    .idle-overlay .tap-hint { margin-top: 30px; padding: 16px 32px; background: #2d5bd1; color: #fff; border-radius: 30px; font-size: 18px; font-weight: 600; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="kiosk-app">
    <div class="kiosk-header">
      <h1 id="biz-name">Nova Assistant</h1>
      <p id="biz-desc">Tap to start chatting</p>
    </div>
    <div class="kiosk-chat" id="kiosk-chat"></div>
    <div class="kiosk-footer">Powered by <a href="/admin">Nova Assistant</a></div>
  </div>
  <div class="idle-overlay" id="idle-overlay" style="display:none">
    <h2>Welcome</h2>
    <p>Tap anywhere to start</p>
    <div class="tap-hint">TAP TO CHAT</div>
  </div>
  <script>
    // v34.1: Kiosk Mode — full-screen customer-facing chat
    // Extracts tenantId from URL path
    const pathParts = window.location.pathname.split('/');
    const tenantId = pathParts[2] || 'cleaning-demo';
    const novaOrigin = window.location.origin;

    // Load widget config for branding
    fetch(`${novaOrigin}/api/widget/config/${tenantId}`)
      .then(r => r.json())
      .then(config => {
        if (config.ok) {
          document.getElementById('biz-name').textContent = config.businessName || config.assistantName || 'Nova';
          document.getElementById('biz-desc').textContent = config.businessDescription || 'Tap to start chatting';
          document.title = config.businessName || 'Nova Kiosk';
          // Update theme color
          if (config.themeColor) {
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = config.themeColor;
          }
        }
      })
      .catch(() => {});

    // Inject the widget script with kiosk settings
    const script = document.createElement('script');
    script.src = `${novaOrigin}/widget.js`;
    script.setAttribute('data-tenant', tenantId);
    script.setAttribute('data-server', novaOrigin);
    script.setAttribute('data-position', 'bottom-center');
    script.async = true;
    document.head.appendChild(script);

    // Auto-open the widget after it loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        // Wait for widget to be ready, then auto-open
        const checkReady = setInterval(() => {
          if (window.__NOVA_WIDGET_MOUNTED__) {
            clearInterval(checkReady);
            // Click the bubble to open
            const bubble = document.querySelector('#nova-widget-host')?.shadowRoot?.querySelector('.nova-bubble');
            if (bubble) bubble.click();
            // Enable voice by default in kiosk mode
            localStorage.setItem('nova-voice-enabled', 'true');
          }
        }, 200);
      }, 1000);
    });

    // Idle timeout: show overlay after 5 minutes of inactivity
    let idleTimer = null;
    const IDLE_TIMEOUT = 5 * 60 * 1000; // 5 minutes

    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(showIdleOverlay, IDLE_TIMEOUT);
    }

    function showIdleOverlay() {
      const overlay = document.getElementById('idle-overlay');
      overlay.style.display = 'flex';
      // Reset conversation
      localStorage.removeItem(`nova-widget:${tenantId}`);
      // Close widget if open
      const panel = document.querySelector('#nova-widget-host')?.shadowRoot?.querySelector('.nova-panel');
      if (panel && !panel.classList.contains('hidden')) {
        const closeBtn = document.querySelector('#nova-widget-host')?.shadowRoot?.querySelector('#nova-close');
        if (closeBtn) closeBtn.click();
      }
    }

    document.getElementById('idle-overlay').addEventListener('click', () => {
      document.getElementById('idle-overlay').style.display = 'none';
      resetIdleTimer();
      // Re-open widget
      setTimeout(() => {
        const bubble = document.querySelector('#nova-widget-host')?.shadowRoot?.querySelector('.nova-bubble');
        if (bubble) bubble.click();
      }, 300);
    });

    // Reset timer on any interaction
    ['click', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
      document.addEventListener(evt, resetIdleTimer, { passive: true });
    });

    resetIdleTimer();
  </script>
</body>
</html>
