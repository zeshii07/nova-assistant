services:
  - type: web
    name: nova-saas-test
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DEFAULT_TENANT_ID
        value: default
      - key: LOG_LEVEL
        value: info
      - key: GROQ_API_KEY
        sync: false
      - key: NOVA_DEV_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID_DEFAULT
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN_DEFAULT
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN_DEFAULT
        sync: false
      - key: WHATSAPP_APP_SECRET_DEFAULT
        sync: false
