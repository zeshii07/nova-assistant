services:
  - type: web
    name: nova-saas-test
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # C2 fix: pin to a single worker while NOVA_STORAGE_MODE is memory.
      # Each worker keeps its own in-memory conversation state; with more than
      # one worker, conversation state is not shared and state.json is
      # overwritten on disk. The server refuses to boot in production with
      # memory storage + >1 worker. Set NOVA_STORAGE_MODE=persistent (with
      # DATABASE_URL + REDIS_URL) to safely run multiple workers.
      - key: NOVA_WORKERS
        value: "1"
      - key: DEFAULT_TENANT_ID
        value: default
      - key: LOG_LEVEL
        value: info
      - key: GROQ_API_KEY
        sync: false
      - key: NOVA_DEV_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID_DEFAULT
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN_DEFAULT
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN_DEFAULT
        sync: false
      - key: WHATSAPP_APP_SECRET_DEFAULT
        sync: false
